
{% extends "base.html" %}
 {% load static %}


                    <script type="text/javascript">

        var checkList = document.getElementById('list1');
        var items = document.getElementById('items');
        checkList.getElementsByClassName('anchor')[0].onclick = function (evt) {
            if (items.classList.contains('visible')){
                items.classList.remove('visible');
                items.style.display = "none";
            }

            else{
                items.classList.add('visible');
                items.style.display = "block";
            }


        }

        items.onblur = function(evt) {
            items.classList.remove('visible');
        }
    </script>
                
        {%block content%}
		<section id="login" class="login section-bg mt-5  mb-5 unversalhight ">
       <div class="container mt-5 mb-5">
        <fieldset class="fieldset mt- mb-5">
    <a href="{% url 'ttgen:addTimings'%}"><h1 class="tablink" onclick="openPage('new')" id="defaultOpen">Back to Add Timings</h1></a>
    <div class="tabcontent" id="edit">
			<table class="table1">
				<thead>
				<tr class="table-headers">
				<th>PID</th>
				<th>Day</th>
				<th>Timing</th>
				<th  class="empty"></th>
				</tr>
				</thead>

				<tbody>
				{% for mt in meeting_times %}
				<tr>
				 <td>{{mt.pid}}</td>
				 <td>{{mt.day}}</td>
				 <td>{{mt.time}}</td>
				 <td class="empty">
					<form action="{% url 'ttgen:deletemeetingtime' mt.pid %}" method="post">
						{% csrf_token %}
						<input type="submit" value="Delete" class="cross btn btn-danger">
					</form>
				 </td>
				 </tr>
				{% endfor %}
				</tbody>

			</table>
		</div>
</fieldset>
	   </div>
	   <section>
	</section>
	<section>
	</section>
		</section>

{% endblock %}
