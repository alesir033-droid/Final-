{% extends "base.html" %}
 {% load static %}
 
                    <script type="text/javascript">

        var checkList = document.getElementById('list1');
        var items = document.getElementById('items');
        checkList.getElementsByClassName('anchor')[0].onclick = function (evt) {
            if (items.classList.contains('visible')){
                items.classList.remove('visible');
                items.style.display = "none";
            }

            else{
                items.classList.add('visible');
                items.style.display = "block";
            }


        }

        items.onblur = function(evt) {
            items.classList.remove('visible');
        }
    </script>
              
        {%block content%}
        <section id="login" class="login section-bg mt-5 unversalhight ">
<div class="container mt-5 mb-5">
        <br><br>
        <h2>Add Timings</h2>
        <h5>Please use the following form to enter the Timings into the system for timetable generation</h5>
<form method="post">
	{% csrf_token %}
	<fieldset>
		<div class="tabcontent" id="new">
			{#{ form.as_p }#}
      <div class="mb-3 col-8">
        <label for="exampleInputEmail1" class="form-label">Meeting ID</label>
        
      </div>
      <div class="mb-3 col-8">
        {{form.pid}}
        
      </div>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Time</label>
        
      </div>
      <div class="mb-3 col-6 ">
        {{form.time}}
        
      </div>
      <div class="mb-3 col-8">
        <label for="exampleInputEmail1" class="form-label">Day of the Week</label>
        
      </div>
      <div class="mb-3 col-8">
        {{form.day}}
        
      </div>
		<a href="{% url 'ttgen:editmeetingtime' %}">
      <h1 class="submit btn btn-primary m-2" onclick="openPage('edit')">View / Edit Timings</h1>
    </a><input type="submit" value="Add Timings" class="submit btn btn-success m-2">
		</div>
	</fieldset>
</form>
</div>
<section>
</section>
        </section>
       
{%endblock%}
