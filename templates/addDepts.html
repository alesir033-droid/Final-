
{% extends "base.html" %}
 {% load static %}

                <script type="text/javascript">

        var checkList = document.getElementById('list1');
        var items = document.getElementById('items');
        checkList.getElementsByClassName('anchor')[0].onclick = function (evt) {
            if (items.classList.contains('visible')){
                items.classList.remove('visible');
                items.style.display = "none";
            }

            else{
                items.classList.add('visible');
                items.style.display = "block";
            }


        }

        items.onblur = function(evt) {
            items.classList.remove('visible');
        }
        </script>
             
        {% block content %}
        <section id="login" class="login section-bg mt-5  unversalhight ">
      <div class="container mt-5 mb-5">
        <br><br>
        <h2>Add Departments</h2>
        <h5>Please use the following form to enter the Departments into the system for timetable generation</h5>
<form method="post">
	{% csrf_token %}
	<fieldset>
		<div class="tabcontent" id="new">
            <div class="mb-3 col-8">
                <label for="exampleInputEmail1" class="form-label">Department Name</label>
                
              </div>
              <div class="mb-3 col-8">
                {{form.dept_name}}
                
              </div>
              <div class="mb-3 col-8">
                <label for="exampleInputEmail1" class="form-label">Corresponding Courses</label>
                
              </div>
              <div class="mb-3 col-8">
                {{form.courses}}
                
              </div>
			{#{ form.as_p }#}
		<a href="{% url 'ttgen:editdepartment' %}">
      <h1 class="submit btn btn-primary m-2" onclick="openPage('edit')">View / Edit Departments</h1></a>
      <input type="submit" value="Add Departments" class=" btn btn-success m-2">
		</div>
	</fieldset>
</form>
      </div>

        </section>
{% endblock %}
